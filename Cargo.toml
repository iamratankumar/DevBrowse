[workspace]
resolver = "2"
members = [
    "crates/pb-ipc",
    "crates/pb-config",
    "crates/pb-sandbox",
    "crates/pb-platform",
    "crates/pb-identity",
    "crates/pb-storage",
    "crates/pb-network",
    "crates/pb-fingerprint",
    "crates/pb-gpu",
    "crates/pb-extensions",
    "crates/pb-update",
    "crates/pb-ui",
    "crates/pb-sync",
    "crates/pb-browser",
    "crates/pb-testkit",
]

[workspace.package]
version    = "0.1.0"
edition    = "2021"
authors    = ["DevBrowse Contributors"]
license    = "MPL-2.0"
repository = "https://github.com/iamratankumar/DevBrowse"
# Workspace crates are internal — never published to crates.io.
# This also satisfies cargo-deny's wildcard-path check.
publish    = false

# ── workspace-wide dependency versions ─────────────────────────────────────
# Individual crates reference these with `{ workspace = true }`.
# Do NOT change versions here without auditing every consumer crate.
[workspace.dependencies]
# inter-crate (allowed by any crate per architecture dependency rule)
pb-ipc     = { path = "crates/pb-ipc" }
pb-config  = { path = "crates/pb-config" }
pb-sandbox = { path = "crates/pb-sandbox" }

# async runtime
tokio = { version = "1", features = ["full"] }

# serialization
serde = { version = "1", features = ["derive"] }
toml  = "0.8"
prost = "0.12"
# Module 41 (extension allowlist) ships its signed manifest as JSON +
# detached Ed25519 sig (architecture v1.10 §3.2). JSON chosen over TOML
# / Protobuf for inspectability: a security researcher can `cat` the
# allowlist and see what DevBrowse trusts without tooling. The
# signature covers the literal on-disk bytes (NOT a re-serialized
# parse) so JSON canonicalization is not required.
serde_json = "1"

# storage
rusqlite = { version = "0.31", features = ["bundled"] }

# networking (hyper 1.x + rustls -- no OpenSSL)
# Architecture v1.10 (Module 23.1): trust anchors = webpki-roots locked.
# System-roots fallback is wizard-opt-in only, lands in Module 23.1.
# Module 20 (DoH client) consumes hyper-rustls with webpki-roots feature
# for the bootstrap trust anchor set.
hyper          = { version = "1", features = ["client", "http1", "http2"] }
hyper-util     = { version = "0.1", features = ["client", "client-legacy", "tokio"] }
hyper-rustls   = { version = "0.27", features = ["http2", "webpki-roots", "ring"], default-features = false }
http           = "1"
http-body-util = "0.1"
bytes          = "1"
# Module 23.1 owns the rustls ClientConfig factory. Pinned to 0.23 (the
# version hyper-rustls 0.27 selects) so direct + transitive paths converge.
# Cohort-watch (README §Adaptation): a 0.23.x bump triggers the protocol;
# a 0.24 bump is a hold. The `tls12` feature is enabled because Module
# 24.1's ClientHello pin advertises both TLS 1.3 and TLS 1.2 suites
# (matching the dominant browser cohort); a feature-set change here is
# itself cohort-relevant and therefore on the cohort-watch list.
rustls         = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
webpki-roots   = "0.26"

# error handling
thiserror = "1"
anyhow    = "1"

# crypto / identifiers
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"

# logging / tracing
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# UI framework (Phase 8 — Module 42+)
# iced 0.14 defaults to the wgpu renderer; the "wgpu" feature enables the
# custom Shader widget used by pb-ui::glass.
iced = { version = "0.14", features = ["wgpu", "canvas"] }
# wgpu is pulled in by iced 0.14 at 27.x; we pin it here so pb-ui::glass
# can use wgpu APIs directly without version skew.
wgpu = "27"

# benches (dev-dependency only — never linked into release binaries).
# README §"Cross-cutting concerns" item 13 mandates a Criterion bench
# under `benches/<module>.rs` for every privacy-critical hot path.
# Module 21 blocklist match is the first; Module 14 partition-key
# derive + Module 19 LRU follow as benches land.
criterion          = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

# ── release profile hardening — Module 2.1 ────────────────────────────────
# Browser parses hostile input; integer overflow must panic, not wrap.
# `panic = "abort"` prevents unwinding across future libxul FFI boundaries.
[profile.release]
panic           = "abort"
overflow-checks = true
lto             = "fat"
codegen-units   = 1
strip           = "symbols"

[profile.dev]
overflow-checks = true
