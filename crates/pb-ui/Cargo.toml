[package]
name    = "pb-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
pb-ipc    = { workspace = true }
pb-config = { workspace = true }
tokio     = { workspace = true }
uuid      = { workspace = true }
thiserror = { workspace = true }
tracing   = { workspace = true }
serde     = { workspace = true }
serde_json = { workspace = true }
# Phase 8 Module 42 — Iced 0.14 + wgpu backend (architecture v1.24 stack lock).
# "wgpu" feature enables the custom Shader widget used by pb-ui::glass.
iced  = { workspace = true }
wgpu  = { workspace = true }

[[bin]]
name = "devbrowse_ui"
path = "src/bin/devbrowse_ui.rs"

[features]
# Enables MockSuggestionProvider for in-crate async tests.
# Must never be enabled in production builds.
mock = []

[build-dependencies]
serde_json = { workspace = true }
