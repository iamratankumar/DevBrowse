[package]
name    = "pb-ipc"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# pb-ipc is the shared IPC contract crate.
# Dependency rule: ANY crate may depend on this one (message types only).
# This crate must NOT depend on any other pb-* crate.

[dependencies]
prost     = { workspace = true }
tokio     = { workspace = true }
uuid      = { workspace = true }
serde     = { workspace = true }
thiserror = { workspace = true }
tracing   = { workspace = true }

# `testkit` exposes a duplex-backed `DuplexConnection` so pb-testkit can
# build in-memory IPC pairs without spawning sockets. The feature is OFF
# by default; release builds never compile the duplex path. Gated rather
# than `#[cfg(test)]` because pb-testkit lives in a different crate and
# must be able to opt in from its own dev-dependencies graph.
[features]
default = []
testkit = []

[dev-dependencies]
tempfile = "3"

[build-dependencies]
prost-build = "0.12"
# protox is a pure-Rust protobuf compiler — eliminates the protoc system dep.
protox = "0.5"
