[package]
name    = "pb-ipc"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# pb-ipc is the shared IPC contract crate.
# Dependency rule: ANY crate may depend on this one (message types only).
# This crate must NOT depend on any other pb-* crate.

[dependencies]
prost     = { workspace = true }
tokio     = { workspace = true }
uuid      = { workspace = true }
serde     = { workspace = true }
thiserror = { workspace = true }
tracing   = { workspace = true }

[dev-dependencies]
tempfile = "3"

[build-dependencies]
prost-build = "0.12"
