[package]
name    = "pb-testkit"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# Module 0.5 — shared test-fixture crate.
#
# Dev-only: every consuming crate adds this under [dev-dependencies], not
# [dependencies]. The fixture surface is gated behind
# `#[cfg(any(test, feature = "testkit"))]` (the feature is enabled
# automatically when consumed as a dev-dep so tests compile with no extra
# flag). Production builds therefore never see the fixture types.
#
# Dependency rule (architecture L12): this crate may import any pb-* crate
# because it is dev-only and never linked into a release binary. It is
# explicitly NOT a leaf crate, by design.

[features]
# `testkit` is the on-switch for the public fixture surface. Enabled by
# default so a `cargo test -p pb-testkit` works without flags. Downstream
# crates that want to compile fixtures into their own test binaries also
# get the feature for free via the default.
default = ["testkit"]
testkit = ["pb-ipc/testkit"]

[dependencies]
# pb-* crates whose surface this fixture wraps. Order tracks crate topology.
pb-config      = { workspace = true }
pb-ipc         = { workspace = true, features = ["testkit"] }
pb-platform    = { path = "../pb-platform" }
pb-identity    = { path = "../pb-identity" }
pb-storage     = { path = "../pb-storage" }
pb-sandbox     = { workspace = true }
# Phase 5 / Module 26 — fingerprint-override harness fixture so Phase 5.5
# (Strict hardening) and Phase 10 (adversarial fingerprint suite) can drive
# `FingerprintOverride::install` across every `JsContext` without copying
# the in-crate test boilerplate. pb-fingerprint depends only on pb-config
# + uuid, so pulling it in here adds no new transitive surface.
pb-fingerprint = { path = "../pb-fingerprint" }
# Phase 6 / Modules 36-39 — gpu_bundle fixture wraps the GpuCoordinator +
# MemoryBudget + QueueScheduler triple so Phase 7+ tests can assert
# cross-identity GPU isolation without re-deriving the orchestrator
# wiring. pb-gpu's dependency footprint is pb-config + pb-ipc + uuid;
# all are already transitive deps here.
pb-gpu         = { path = "../pb-gpu" }
# Phase 7 / Modules 40-41 — extensions_bundle fixture wraps the
# Module 40 BlockerPolicy resolver + Module 41 ExtensionController +
# InMemoryTrustedVerifier so Phase 8+ tests can drive end-to-end
# "Strict tab + allowlisted extension = chrome undefined" without
# re-deriving the seed-manifest + verifier wiring. pb-extensions's
# dependency footprint is pb-ipc + pb-config + serde + serde_json +
# sha2 + uuid + thiserror + tracing + tokio — all already transitive.
pb-extensions  = { path = "../pb-extensions" }
serde_json     = { workspace = true }

# async + utility deps shared with the production crates we mock.
tokio        = { workspace = true }
uuid         = { workspace = true }
thiserror    = { workspace = true }

# Module 24.2 — the ja3_probe fixture takes Arc<rustls::ClientConfig>
# and drives ClientConnection::new + write_tls synchronously to capture
# the rendered ClientHello. Same 0.23 pin as the workspace; cohort-watched.
rustls       = { workspace = true }

# Property-based testing scaffolding (subtask 4 of Module 0.5).
proptest     = "1"

[dev-dependencies]
# Self-tests for the fixtures themselves.
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
