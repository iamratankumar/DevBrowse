# cargo-deny — supply chain audit for DevBrowse.
# Module 2.1 hardening. Run: cargo deny check
#
# This file is the security gate for every dependency entering the workspace.
# Tightening over time is fine; loosening requires explicit review.

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked  = "deny"
ignore  = [
    # RUSTSEC-2024-0436: `paste` proc-macro is unmaintained (dtolnay archived it).
    # No safe upgrade exists. Pulled in by metal -> wgpu-hal -> wgpu -> iced_wgpu.
    # We do not call paste directly; risk is confined to the Metal GPU backend.
    # Re-evaluate when wgpu drops or replaces the dep.
    { id = "RUSTSEC-2024-0436" },
    # RUSTSEC-2025-0052: `async-std` has been discontinued. No safe upgrade exists.
    # Pulled in transitively by dark-light v2.0.0 -> async-std for Linux D-Bus detection.
    # We do not call async-std directly. Re-evaluate when dark-light drops this dep.
    { id = "RUSTSEC-2025-0052" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "MPL-2.0",
    "Zlib",
    "CC0-1.0",
    # BSL-1.0 (Boost Software License 1.0) — OSI-approved, FSF-free permissive.
    # Pulled in by clipboard-win + error-code via iced -> iced_winit -> window_clipboard.
    "BSL-1.0",
    # webpki-roots redistributes Mozilla's CCADB trust-anchor dataset.
    # CDLA-Permissive-2.0 (Community Data License Agreement) is the SPDX
    # license used for community data redistribution; it is OSI-aligned
    # permissive and is the same license Chrome / Firefox use for the
    # same anchor set. Locked in Module 23.1 (architecture v1.10).
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.93

[bans]
multiple-versions    = "warn"
wildcards            = "deny"
# Internal workspace path-deps (pb-ipc, pb-config) carry no version field;
# this is fine because they're never published to crates.io. Wildcards are
# still denied for *external* deps - exactly what we want.
allow-wildcard-paths = true

# Known transitive duplicates we accept. Each entry must justify itself.
skip = [
    # wit-bindgen ships two versions through getrandom's WASI shims:
    # 0.51.0 via wasip3 (getrandom 0.4.x), 0.57.1 via wasip2 (getrandom 0.3.x).
    # Both are gated to WASI targets; native DevBrowse builds never compile
    # either. Upstream unification is getrandom's call, not ours.
    { name = "wit-bindgen" },
]

[sources]
unknown-registry = "deny"
unknown-git      = "deny"
allow-registry   = ["https://github.com/rust-lang/crates.io-index"]
